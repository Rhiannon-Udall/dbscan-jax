[project]
name = "dbscan-jax"
version = "0.1.0"
description = "jax implementation of the DBSCAN clustering algorithm"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "ipython>=9.10.0",
    "jax[cuda12]>=0.9.1",
    "jupyterlab>=4.5.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "psutil>=6.1.0",
    "scikit-learn>=1.6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbscan"]

